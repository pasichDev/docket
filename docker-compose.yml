# Example headless deployment (RFC "Local and Self-Hosted Backend Modes" §25). Put this
# behind a reverse proxy (Caddy/nginx/Traefik) that terminates HTTPS for anything reachable
# outside your own LAN — see docs/headless.md and RFC §15. docket itself never becomes a
# certificate authority.
services:
  docket:
    image: ghcr.io/pasichdev/docket:latest
    # build: .   # uncomment to build from this checkout instead of pulling the published image
    restart: unless-stopped
    ports:
      - "8788:8788"
    volumes:
      - ./data:/data
    environment:
      DOCKET_DATA_DIR: /data
      DOCKET_SERVER_HOST: 0.0.0.0
      DOCKET_SERVER_PORT: 8788
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8788/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
